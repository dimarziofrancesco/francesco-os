name: Sync Instagram
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - run: |
          git config user.name "instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/instagram
          git diff --cached --quiet || git commit -m "Aggiorna foto Instagram"
          git push
