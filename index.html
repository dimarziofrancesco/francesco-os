<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Francesco Di Marzio — Digital Innovation Expert. AI nei processi, web app su misura e infrastruttura IT.">
<meta property="og:title" content="Francesco Di Marzio — Digital Innovation Expert">
<meta property="og:image" content="img/fotografia_foto-03.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Francesco OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: un sistema operativo "premium" — sfondo fotografico (uno scatto di Francesco), barra menu e dock in vetro,
   finestre traslucide trascinabili, widget sulla scrivania, ricerca rapida ⌘K. Su telefono diventa una home a icone con app a tutto schermo. */
:root{
  --glass:rgba(250,248,246,.72);
  --glass-strong:rgba(252,251,250,.9);
  --glass-line:rgba(255,255,255,.55);
  --surface:#FFFFFF;
  --surface-2:#F2EFEC;
  --fg:#17140F;
  --fg-2:#5E574F;
  --hair:rgba(23,20,15,.1);
  --accent:#E8762D;          /* ambra del tramonto sul pontile */
  --accent-soft:rgba(232,118,45,.14);
  --ok:#2E9E5B;
  --shadow:0 30px 80px -20px rgba(10,8,6,.55),0 8px 24px -8px rgba(10,8,6,.35);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-win:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(28,24,22,.66);--glass-strong:rgba(30,26,24,.9);--glass-line:rgba(255,255,255,.12);
  --surface:#1F1B19;--surface-2:#2A2522;--fg:#F4EFEA;--fg-2:#ADA49B;--hair:rgba(255,255,255,.1);
  --accent:#FF9A4D;--accent-soft:rgba(255,154,77,.16);--ok:#5BD08A;color-scheme:dark}}
:root[data-theme="dark"]{
  --glass:rgba(28,24,22,.66);--glass-strong:rgba(30,26,24,.9);--glass-line:rgba(255,255,255,.12);
  --surface:#1F1B19;--surface-2:#2A2522;--fg:#F4EFEA;--fg-2:#ADA49B;--hair:rgba(255,255,255,.1);
  --accent:#FF9A4D;--accent-soft:rgba(255,154,77,.16);--ok:#5BD08A;color-scheme:dark}

html,body{height:100%}
body{background:#1A1512;color:var(--fg);font-family:var(--f-body);font-size:14.5px;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{display:block}
[hidden]{display:none!important}

/* Sfondo */
.wall{position:fixed;inset:0;background:#1A1512 url("img/fotografia_foto-03.webp") center 62%/cover no-repeat}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.35),rgba(20,14,10,.05) 30%,rgba(20,14,10,.45))}

/* Barra menu */
.menubar{position:fixed;top:0;left:0;right:0;z-index:9000;height:calc(30px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:18px;color:#fff;font-size:13px;background:rgba(18,13,10,.28);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.menubar .logo{font-family:var(--f-display);font-weight:800;letter-spacing:.02em}
.menubar .app{font-weight:600}
.menubar .sp{flex:1}
.menubar .item{opacity:.9;white-space:nowrap}
.menubar .search{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px}
.menubar .search:hover{background:rgba(255,255,255,.14)}
.menubar kbd{font-family:var(--f-mono);font-size:11px;opacity:.75}
.mb-hide{display:inline}

/* Widget */
.widgets{position:fixed;top:54px;right:max(24px,env(safe-area-inset-right,0px));width:260px;display:grid;gap:14px;z-index:1}
.widget{border-radius:22px;background:rgba(24,17,12,.38);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);color:#fff;padding:16px 18px;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.w-clock .t{font-family:var(--f-display);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.w-clock .d{font-size:13px;opacity:.85;margin-top:6px;text-transform:capitalize}
.w-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.w-now h4{margin:6px 0 4px;font-family:var(--f-display);font-size:18px;line-height:1.15}
.w-now p{margin:0;font-size:12.5px;opacity:.85;line-height:1.45}
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;width:62%;background:#fff;border-radius:99px}
.w-photo{padding:0;overflow:hidden;aspect-ratio:4/5;position:relative;cursor:pointer}
.w-photo img{width:100%;height:100%;object-fit:cover;transition:opacity .6s}
.w-photo span{position:absolute;left:14px;bottom:12px;font-size:12px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* Home a icone (solo telefono) */
.home{display:none}

/* Finestre */
.desk{position:fixed;inset:30px 0 0 0;z-index:5;pointer-events:none}
.desk>.win{pointer-events:auto}
.win{position:absolute;display:flex;flex-direction:column;border-radius:var(--r-win);background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:var(--shadow);overflow:hidden;
  max-width:calc(100vw - 24px);max-height:calc(100vh - 140px);transition:box-shadow .2s}
.win:not(.active){box-shadow:0 18px 50px -20px rgba(10,8,6,.45)}
.win:not(.active) .head{opacity:.8}
.win.max{left:12px!important;top:8px!important;width:calc(100vw - 24px)!important;height:calc(100vh - 140px)!important}
.win.min{display:none}
.head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:grab;user-select:none;touch-action:none;border-bottom:1px solid var(--hair)}
.ctl{display:flex;gap:8px}
.ctl button{width:13px;height:13px;border-radius:50%;background:var(--hair);display:grid;place-items:center;font-size:9px;line-height:1;color:transparent}
.win.active .ctl .c{background:#F0605A}.win.active .ctl .m{background:#F5BE4F}.win.active .ctl .z{background:#5DC269}
.ctl:hover button{color:rgba(0,0,0,.55)}
.head h2{margin:0;flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:60px}
.wbody{overflow:auto;min-height:0;flex:1;background:var(--glass-strong)}
.pad{padding:24px 28px 28px}

/* Tipografia contenuti */
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.4vw,44px);line-height:.98;letter-spacing:-.03em;margin:8px 0 12px;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 8px;text-wrap:balance}
.lead{font-size:15.5px;line-height:1.6;color:var(--fg-2);max-width:62ch;margin:0 0 14px}
p{line-height:1.6}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--hair)}
.meta dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.meta dd{margin:2px 0 0;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Info */
.about{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:start}
.avatar{width:150px;aspect-ratio:1;border-radius:36px;background:linear-gradient(140deg,#F7A35C,#C9462B 55%,#5A1E2F);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:54px;letter-spacing:-.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 30px -12px rgba(201,70,43,.6)}
.about>div{min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* Gallerie */
.masonry{columns:3 200px;column-gap:12px}
.masonry button{width:100%;margin:0 0 12px;break-inside:avoid;border-radius:14px;overflow:hidden;position:relative;background:var(--surface-2);display:block;text-align:left}
.masonry img{width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.masonry button:hover img{transform:scale(1.03)}
.masonry .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;opacity:0;transition:opacity .2s}
.masonry button:hover .cap,.masonry button:focus-visible .cap{opacity:1}
.cap b{display:block;font-size:13px}.cap small{font-size:11.5px;opacity:.85}
.feedhead{display:flex;gap:20px;align-items:center;margin-bottom:22px}
.ring{width:84px;height:84px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#FFC66B,#FF7A3D,#D9367A,#7A4CF0,#FFC66B)}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--surface);background:linear-gradient(140deg,#F7A35C,#C9462B 55%,#5A1E2F);color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:14px;overflow:hidden}
.feed button{aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.feed img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .3s}
.feed button:hover img{transform:scale(1.05);filter:brightness(1.06)}

/* Case study */
.case{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:start;padding:24px 28px;border-bottom:1px solid var(--hair)}
.case:last-child{border-bottom:0}
.case .hero{border-radius:16px;overflow:hidden;background:var(--surface-2);width:100%}
.case .hero img{width:100%;height:auto}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;grid-column:1/-1}
.strip button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.strip img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.strip button:hover img{transform:scale(1.06)}
.light-bg{background:#F2EFEC!important}

/* Sidebar (Finder) */
.split{display:grid;grid-template-columns:180px 1fr;height:100%}
.side{border-right:1px solid var(--hair);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--glass) 60%,transparent)}
.side .lbl{font-size:11px;color:var(--fg-2);padding:8px 10px 4px;font-weight:600}
.side button{text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side button:hover:not(.on){background:var(--hair)}
.split>.content{overflow:auto;min-width:0}

/* Metodo e competenze */
.steps{list-style:none;counter-reset:st;margin:18px 0 0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;column-gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.steps li::before{content:counter(st);grid-row:1/span 2;width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px}
.feat{list-style:none;margin:16px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;grid-column:1/-1}
.feat li{display:grid;gap:3px;align-content:start;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.feat b{font-weight:600}.feat span{color:var(--fg-2);font-size:13.5px;line-height:1.5}
.steps b{font-weight:600}.steps span{color:var(--fg-2);font-size:13.5px;line-height:1.5}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.skills>div{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.skills h4{margin:0 0 4px;font-family:var(--f-display);font-size:16px}
.skills p{margin:0;font-size:13.5px;color:var(--fg-2);line-height:1.5}
/* Timeline */
.tl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:120px 18px 1fr;gap:12px}
.tl time{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);padding-top:3px;font-variant-numeric:tabular-nums;text-align:right}
.tl .dot{position:relative}
.tl .dot::before{content:"";position:absolute;left:50%;top:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .dot::after{content:"";position:absolute;left:50%;top:20px;bottom:0;width:2px;margin-left:-1px;background:var(--hair)}
.tl li:last-child .dot::after{display:none}
.tl li>div:last-child{padding-bottom:22px;min-width:0}
.tl h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.tl p{margin:4px 0 0;color:var(--fg-2)}

/* Contatti */
.clist{display:grid;gap:8px;margin-top:16px}
.crow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);flex-wrap:wrap}
.crow .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);width:84px}
.crow .v{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.crow .act{font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--surface-2);text-decoration:none}
.crow .act:hover{background:var(--accent);color:#fff}

/* Terminale */
.term .wbody{background:rgba(16,13,11,.92);color:#E9E2DA;font-family:var(--f-mono);font-size:13px;line-height:1.6}
.term .head{background:rgba(16,13,11,.9);border-color:rgba(255,255,255,.08)}
.term .head h2{color:#ADA49B}
.out{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px 16px 0}
.out .c{color:#FF9A4D}
.prompt{display:flex;gap:8px;padding:2px 16px 16px}
.prompt label{color:#FF9A4D;white-space:nowrap}
.prompt input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;outline:none;caret-color:#FF9A4D}

/* Dock */
.dock{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9000;display:flex;align-items:flex-end;gap:12px;padding:10px 16px;border-radius:26px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.dock .sep{width:1px;align-self:stretch;margin:8px 4px;background:rgba(255,255,255,.3)}
.dk{position:relative;flex:none;width:54px;height:54px;transition:width .14s ease-out,height .14s ease-out}
.dk .ic{width:100%;height:100%}
.dk::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;opacity:0}
.dk.open::after{opacity:.9}
.dk .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(30,26,24,.85);color:#fff;font-size:12px;padding:4px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}

/* Icone app */
.ic{display:grid;place-items:center;border-radius:24%;color:#fff;background:rgba(22,18,15,.52);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.ic svg{width:52%;height:52%}

/* Spotlight */
.spot{position:fixed;inset:0;z-index:9500;display:grid;justify-items:center;align-content:start;padding-top:16vh;padding-left:16px;padding-right:16px;background:rgba(10,8,6,.25)}
.spot-box{width:min(620px,100%);border-radius:20px;background:var(--glass-strong);border:1px solid var(--glass-line);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);box-shadow:var(--shadow);overflow:hidden}
.spot input{width:100%;border:0;background:transparent;font:inherit;font-size:20px;padding:18px 20px;color:var(--fg);outline:none}
.spot ul{list-style:none;margin:0;padding:6px;border-top:1px solid var(--hair);max-height:50vh;overflow:auto}
.spot li button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;text-align:left}
.spot li button[aria-selected="true"]{background:var(--accent);color:#fff}
.spot li .ic{width:28px;height:28px;flex:none;border-radius:8px}
.spot li small{margin-left:auto;opacity:.7;font-size:12px}

/* Anteprima (lightbox) */
.lb{position:fixed;inset:0;z-index:9600;background:rgba(12,10,8,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-rows:auto 1fr auto;color:#fff;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lb-top b{font-size:15px}.lb-top small{opacity:.7;margin-left:8px}
.lb-stage{display:grid;place-items:center;min-height:0;padding:14px 0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.lb-nav{display:flex;justify-content:center;gap:10px}
.lb button.r{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}
.lb button.r:hover{background:rgba(255,255,255,.28)}

/* Telefono */
@media (max-width:760px){
  .widgets,.mb-hide{display:none}
  .menubar{gap:10px}
  .home{display:grid;position:fixed;top:calc(46px + env(safe-area-inset-top,0px));left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    grid-template-columns:repeat(4,1fr);gap:20px 10px;z-index:1}
  .home .hw{grid-column:1/-1;border-radius:24px;padding:16px 18px;color:#fff;background:rgba(24,17,12,.38);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
  .home .hw .t{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em}
  .home .hw p{margin:6px 0 0;font-size:13px;opacity:.9}
  .home .app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11.5px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .home .ic{width:60px;height:60px;border-radius:16px}
  .dock{gap:14px;padding:10px 14px}
  .dock .more,.dock .sep{display:none}
  .dk{width:56px;height:56px}
  .dk .tip{display:none}
  .desk{inset:calc(30px + env(safe-area-inset-top,0px)) 0 0 0}
  body.has-win .dock{display:none}

  progetti:{name:"Progetti", w:800, h:620, x:300, y:64, html:()=>`
    <div class="split">
      <div class="side" role="tablist"><span class="lbl">In corso</span>
        <button class="on" data-jump="p-app">MyAuricon</button><button data-jump="p-ai">AI in Auricon</button><span class="lbl">Conclusi</span><button data-jump="p-udito">UditoinForma</button><button data-jump="p-sap">Migrazione SAP</button></div>

const DOCK = ["info","progetti","ai","cv","contatti","foto","terminale"];

/* ---------- Window manager ---------- */
const desk=document.getElementById("desk"), dock=document.getElementById("dock"), home=document.getElementById("home");
const S={z:20, wins:{}, active:null};
const small=()=>matchMedia("(max-width:760px)").matches;

DOCK.forEach((k,i)=>{
  if(i===DOCK.length-1){const s=document.createElement("span");s.className="sep";dock.appendChild(s)}
  const b=document.createElement("button");
  b.className="dk"+(["ai","cv","terminale"].includes(k)?" more":""); b.dataset.app=k;
  b.innerHTML=icon(k)+`<span class="tip">${APPS[k].name}</span>`; b.setAttribute("aria-label",APPS[k].name);
  b.addEventListener("click",()=>openApp(k)); dock.appendChild(b);
  const h=document.createElement("button"); h.className="app"; h.innerHTML=icon(k)+`<span>${APPS[k].name.split(" ·")[0].replace("Info su Francesco","Info")}</span>`;
  h.addEventListener("click",()=>openApp(k)); home.appendChild(h);
});

function openApp(k){
  const ex=S.wins[k];
  if(ex){ ex.classList.remove("min"); return focus(k); }
  const a=APPS[k], el=document.createElement("section");
  el.className="win opening"+(a.cls?" "+a.cls:""); el.setAttribute("aria-label",a.name);
  const W=Math.min(a.w, innerWidth-40), H=Math.min(a.h, innerHeight-150);
  const wx = innerWidth>1100 ? a.x : Math.max(12,(innerWidth-W)/2 - 20 + Object.keys(S.wins).length*18);
  el.style.cssText=`width:${W}px;height:${H}px;left:${Math.min(wx,innerWidth-W-12)}px;top:${Math.min(a.y,innerHeight-H-130)}px`;
  el.innerHTML=`<header class="head"><div class="ctl"><button class="c" aria-label="Chiudi">×</button><button class="m" aria-label="Riduci">–</button><button class="z" aria-label="Ingrandisci">+</button></div><h2>${a.name}</h2></header><div class="wbody">${a.html()}</div>`;
  desk.appendChild(el); S.wins[k]=el;
  el.addEventListener("animationend",()=>el.classList.remove("opening"),{once:true});
  el.querySelector(".c").onclick=e=>{e.stopPropagation();close(k)};
  el.querySelector(".m").onclick=e=>{e.stopPropagation();el.classList.add("min");pickTop()};
  el.querySelector(".z").onclick=e=>{e.stopPropagation();el.classList.toggle("max")};
  el.querySelector(".head").addEventListener("dblclick",()=>!small()&&el.classList.toggle("max"));
  el.addEventListener("pointerdown",()=>focus(k));
  drag(el,el.querySelector(".head"));
  if(k==="terminale") term(el);
  if(k==="progetti") brandNav(el);
  focus(k);
}
function close(k){ S.wins[k]?.remove(); delete S.wins[k]; pickTop(); }
function pickTop(){
  const vis=Object.entries(S.wins).filter(([,w])=>!w.classList.contains("min")).sort((a,b)=>b[1].style.zIndex-a[1].style.zIndex);
  vis.length?focus(vis[0][0]):(S.active=null,sync());
}
function focus(k){
  const el=S.wins[k]; if(!el) return;
  el.style.zIndex=++S.z; S.active=k;
  for(const [n,w] of Object.entries(S.wins)) w.classList.toggle("active",n===k);
  sync();
}
function sync(){
  document.getElementById("mbApp").textContent=S.active?APPS[S.active].name.split(" ·")[0]:"Scrivania";
  dock.querySelectorAll(".dk").forEach(d=>d.classList.toggle("open",!!S.wins[d.dataset.app]));
  document.body.classList.toggle("has-win",Object.values(S.wins).some(w=>!w.classList.contains("min")));
}
function drag(win,h){
  let sx,sy,ox,oy,on=false;
  h.addEventListener("pointerdown",e=>{
    if(small()||e.target.closest(".ctl")||win.classList.contains("max")) return;
    on=true;sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;h.setPointerCapture(e.pointerId);h.style.cursor="grabbing";
  });
  h.addEventListener("pointermove",e=>{ if(!on) return;
    win.style.left=Math.min(Math.max(ox+e.clientX-sx,-win.offsetWidth+120),innerWidth-120)+"px";
    win.style.top=Math.min(Math.max(oy+e.clientY-sy,0),innerHeight-120)+"px";
  });
  const end=()=>{on=false;h.style.cursor=""}; h.addEventListener("pointerup",end); h.addEventListener("pointercancel",end);
}
function brandNav(el){
  const c=el.querySelector(".content");
  el.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    el.querySelectorAll("[data-jump]").forEach(x=>x.classList.toggle("on",x===b));
    c.scrollTo({top:el.querySelector("#"+b.dataset.jump).offsetTop-c.offsetTop+ (small()?0:0),behavior:"smooth"});
  }));
}

/* ---------- Dock: ingrandimento ---------- */
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
  dock.addEventListener("pointermove",e=>{ if(small()) return;
    dock.querySelectorAll(".dk").forEach(d=>{const r=d.getBoundingClientRect();const dist=Math.abs(e.clientX-(r.left+r.width/2));
      const sz=Math.round(54*(1+Math.max(0,1-dist/150)*.42)); d.style.width=d.style.height=sz+"px";});
  });
  dock.addEventListener("pointerleave",()=>dock.querySelectorAll(".dk").forEach(d=>{d.style.width=d.style.height=""}));
}

/* ---------- Anteprima ---------- */
const lb=document.getElementById("lb"); let LB={list:[],i:0};
function showLB(){const x=LB.list[LB.i];const img=document.getElementById("lbImg");img.src=x.f;img.alt=x.title;img.style.background=x.light?"#F2EFEC":"transparent";
  document.getElementById("lbTitle").textContent=x.title;document.getElementById("lbMeta").textContent=x.meta;document.getElementById("lbCount").textContent=`${LB.i+1} / ${LB.list.length}`;}
function openLB(key,i){LB={list:LISTS[key],i};lb.hidden=false;showLB();document.getElementById("lbClose").focus();}
const step=d=>{LB.i=(LB.i+d+LB.list.length)%LB.list.length;showLB()};
document.getElementById("lbPrev").onclick=()=>step(-1);document.getElementById("lbNext").onclick=()=>step(1);
document.getElementById("lbClose").onclick=()=>lb.hidden=true;
lb.addEventListener("click",e=>{if(e.target===lb||e.target.classList.contains("lb-stage"))lb.hidden=true});

/* ---------- Spotlight ---------- */
const spot=document.getElementById("spot"), spotIn=document.getElementById("spotIn"), spotList=document.getElementById("spotList");
const ENTRIES=[
  ...DOCK.map(k=>({label:APPS[k].name,hint:"App",ic:k,run:()=>openApp(k)})),
  {label:"MyAuricon",hint:"Progetti",ic:"progetti",run:()=>openApp("progetti")},
  {label:"AI nei processi",hint:"Progetti",ic:"progetti",run:()=>{openApp("progetti");setTimeout(()=>S.wins.progetti.querySelector('[data-jump="p-ai"]').click(),60)}},
  {label:"Migrazione SAP S/4HANA",hint:"Progetti",ic:"progetti",run:()=>{openApp("progetti");setTimeout(()=>S.wins.progetti.querySelector('[data-jump="p-sap"]').click(),60)}},
  {label:"Competenze",hint:"Come lavoro",ic:"ai",run:()=>openApp("ai")},
  {label:"UditoinForma",hint:"Progetti",ic:"progetti",run:()=>{openApp("progetti");setTimeout(()=>S.wins.progetti.querySelector('[data-jump="p-udito"]').click(),60)}},
  {label:"Foto",hint:"Galleria",ic:"foto",run:()=>openApp("foto")},
  {label:"Email",hint:"Contatti",ic:"contatti",run:()=>openApp("contatti")}
];
let sel=0, shown=[];
function renderSpot(){
  const q=spotIn.value.trim().toLowerCase();
  shown=ENTRIES.filter(e=>!q||(e.label+" "+e.hint).toLowerCase().includes(q)).slice(0,9); sel=Math.min(sel,Math.max(0,shown.length-1));
  spotList.innerHTML=shown.length?shown.map((e,i)=>`<li><button role="option" aria-selected="${i===sel}" data-si="${i}">${icon(e.ic)}<span>${e.label}</span><small>${e.hint}</small></button></li>`).join(""):`<li style="padding:12px 14px;color:var(--fg-2)">Nessun risultato per "${spotIn.value.replace(/</g,"")}"</li>`;
}
function openSpot(){spot.hidden=false;spotIn.value="";sel=0;renderSpot();spotIn.focus()}
const runSpot=i=>{const e=shown[i];if(e){spot.hidden=true;e.run()}};
document.getElementById("openSpot").onclick=openSpot;
spotIn.addEventListener("input",()=>{sel=0;renderSpot()});
spotIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){sel=Math.min(sel+1,shown.length-1);renderSpot();e.preventDefault()}
  if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);renderSpot();e.preventDefault()}
  if(e.key==="Enter")runSpot(sel);
});
spotList.addEventListener("click",e=>{const b=e.target.closest("[data-si]");if(b)runSpot(+b.dataset.si)});
spot.addEventListener("click",e=>{if(e.target===spot)spot.hidden=true});

/* ---------- Terminale ---------- */
function term(el){
  const out=el.querySelector("#out"), inp=el.querySelector("#tin");
  const C={
    help:"comandi: whoami · lavori · stack · contatti · apri <app> · ls · clear",
    whoami:"Francesco Di Marzio — Digital Innovation Expert. AI, web app e IT. Chieti, Italia.",
    lavori:"myauricon/      Next.js · PostgreSQL · PWA    [in corso]\nai-auricon/     AI nei processi aziendali     [continuo]\nuditoinforma/   sito per APS no-profit        [2026]\nsap-s4hana/     migrazione in Fater           [2022–23]",
    stack:"AI tools · web app (HTML/CSS/JS) · sistemi e reti · SAP ABAP",
    contatti:"dimarzio.francesco.2003@gmail.com\nlinkedin.com/in/dimarziofrancesco",
    ls:DOCK.join("  "),
    sudo:"Permesso negato. Ma apprezzo l'iniziativa."
  };
  el.querySelector("#tform").addEventListener("submit",e=>{
    e.preventDefault(); const raw=inp.value.trim(); inp.value=""; if(!raw) return;
    const [c,a]=raw.split(/\s+/); let r;
    if(c==="clear"){out.textContent="";return}
    if(c==="apri"){const k=DOCK.find(k=>k.startsWith((a||"").toLowerCase()));r=k?(setTimeout(()=>openApp(k),120),`apro ${APPS[k].name}…`):"uso: apri "+DOCK.join(" | ");}
    else r=C[c]||`comando non trovato: ${c}`;
    out.insertAdjacentHTML("beforeend",`<span class="c">› ${raw.replace(/[<&]/g,"")}</span>\n${r.replace(/</g,"&lt;")}\n`);
    el.querySelector(".wbody").scrollTop=1e9;
  });
  setTimeout(()=>inp.focus({preventScroll:true}),80);
}

/* ---------- Eventi globali ---------- */
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){openApp(o.dataset.open);return}
  const l=e.target.closest("[data-lb]"); if(l){openLB(l.dataset.lb,+l.dataset.i);return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const t=document.getElementById(cp.dataset.copy);
    navigator.clipboard?.writeText(t.textContent).then(()=>{cp.textContent="Copiata";setTimeout(()=>cp.textContent="Copia",1500)})
      .catch(()=>{const r=document.createRange();r.selectNodeContents(t);getSelection().removeAllRanges();getSelection().addRange(r)});}
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();spot.hidden?openSpot():spot.hidden=true;return}
  if(!lb.hidden){ if(e.key==="Escape")lb.hidden=true; if(e.key==="ArrowRight")step(1); if(e.key==="ArrowLeft")step(-1); return }
  if(e.key==="Escape"&&!spot.hidden){spot.hidden=true}
});
document.getElementById("wPhoto").onclick=()=>openApp("foto");

/* Orologio e widget foto */
const tick=()=>{const d=new Date();const t=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("wTime").textContent=t;document.getElementById("hTime").textContent=t;
  document.getElementById("wDate").textContent=d.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("mbClock").textContent=d.toLocaleString("it-IT",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});};
tick(); setInterval(tick,10000);
let pi=7; setInterval(()=>{const im=document.getElementById("wPhotoImg");pi=(pi+1)%FOTO.length;im.style.opacity=0;setTimeout(()=>{im.src=FOTO[pi].t;im.style.opacity=1},500)},6000);


/* Foto da Instagram: se esiste assets/instagram/feed.json (creato dalla GitHub Action) sostituisce gli scatti locali */
fetch("assets/instagram/feed.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(feed=>{
  if(!Array.isArray(feed)||!feed.length) return;
  FOTO=feed.map((p,i)=>({t:p.images[0],f:p.images[0],title:(p.caption||"").split("\n")[0].slice(0,60)||`Scatto ${i+1}`,
    meta:new Date(p.date).toLocaleDateString("it-IT",{month:"long",year:"numeric"})}));
  LISTS.foto=FOTO;
}).catch(()=>{});

/* Stato iniziale: presentazione con i progetti accanto */
if(!small()){ openApp("progetti"); openApp("info"); }
</script>
